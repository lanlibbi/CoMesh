version: "3.9"

# Live GPU-Pool stack, deployed from the GPU-Pool main branch (LANA-58 rollout).
#
# Deliberately separate from projects/opencode-poc: that working tree carries
# uncommitted work (alerts, node-agent) that must not be touched or rebuilt.
# This file therefore brings its own image names and points at the SAME named
# volume, so the live data (users/nodes/usage) survives the rollout.
#
# Rollback: `docker compose -p gpu-pool-live down` then
#           `docker compose -f ~/projects/opencode-poc/docker-compose.yml up -d`
#           (the previous images are kept, tagged gpu-pool-*:rollback-*).

name: comesh

services:
  api:
    build: .
    image: comesh-api:0.6.9
    container_name: comesh-api
    restart: unless-stopped
    ports:
      - "8765:8000"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - DEFAULT_MODEL=qwen2.5-coder:7b
      - DATA_DIR=/data
      - DOCKER_ENV=1
      # Die API steht ausschliesslich hinter dem frontend-nginx. Ohne dieses
      # Flag keyt die Login-Sperre auf die Adresse des nginx-Containers —
      # dann sperren fuenf Fehlversuche alle Benutzer aus. TRUSTED_PROXY_NETS
      # ist bewusst eng: nur das Compose-Netz, aus dem nginx kommt.
      - TRUST_PROXY_HEADERS=1
      - TRUSTED_PROXY_NETS=172.31.0.0/16,127.0.0.1/32
      # Mock-/Simulationspfade der Zahlungen sind in Produktion aus. Zum
      # Entwickeln in der .env auf 1 setzen; dann schreiben sie Guthaben gut.
      - PAYMENTS_ALLOW_MOCK=${PAYMENTS_ALLOW_MOCK:-0}
      # Zahlungen: leer = keine echten Zahlungen. Sobald PAYPAL_MODE=live gilt,
      # muss PAYPAL_RECEIVER_EMAIL gesetzt sein, sonst lehnt die IPN-Pruefung
      # jede Meldung ab (fail closed).
      - PAYPAL_MODE=${PAYPAL_MODE:-sandbox}
      - PAYPAL_RECEIVER_EMAIL=${PAYPAL_RECEIVER_EMAIL:-}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-}
      - PAYPAL_IPN_URL=${PAYPAL_IPN_URL:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      # Admin bootstrap for /admin/* (see docs/api.md -> Admin).
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@gpu-pool.local}
      - ADMIN_NAME=${ADMIN_NAME:-Platform Admin}
      - PROMOTE_ADMIN_EMAIL=${PROMOTE_ADMIN_EMAIL:-}
    volumes:
      - sqlite_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Single-worker policy: the WS registry and pending-job futures in ws.py are
    # process-local, so workers > 1 would split the agent connection from the
    # request handler. Do not bump this without Redis pub/sub (Phase 3).
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]

  frontend:
    build: ./frontend-alpine
    image: comesh-frontend:0.6.9
    container_name: comesh-frontend
    restart: unless-stopped
    ports:
      - "8767:80"
    depends_on:
      - api

  # ---------------------------------------------------------------- #
  # node-agent - Node 1 auf dem Portal-Host selbst                     #
  # Netzwerk und Ports sind Teil der Definition (Compose-Default-      #
  # Netzwerk = gpu-pool-live_default, gleiches Netz wie api). Damit    #
  # ueberlebt der Node `docker rm`, `docker compose up` und Reboots    #
  # ohne manuelles `docker network connect` (LANA-132, Ausfall 25.09.).#
  # PORTAL_URL zeigt auf den Service-Namen statt host.docker.internal. #
  # Profil "node": auf dem Portal-Host per COMPOSE_PROFILES=node in der  #
  # .env aktiv, auf fremden Hosts startet der Service nicht mit.        #
  # ---------------------------------------------------------------- #
  node-agent:
    profiles: ["node"]
    build: ./node-agent
    image: comesh-agent:0.6.9
    container_name: comesh-agent
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - PORTAL_URL=http://api:8000
      - NODE_ID=1
      # Aus .env (nicht im Repo): Knoten-Schluessel aus POST /nodes/register
      - NODE_API_KEY=${NODE_API_KEY:-}
      - OLLAMA_URL=http://host.docker.internal:11434
      - AGENT_PORT=11435
      - HEARTBEAT_SEC=30
    ports:
      # Portal erreicht den Node unter gpu_nodes.tailscale_ip:11435.
      # Lokal (Default) nur 127.0.0.1; auf dem Portal-Host steht
      # NODE_AGENT_BIND_IP=<tailscale-ip> in der .env.
      - "${NODE_AGENT_BIND_IP:-127.0.0.1}:11435:11435"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  sqlite_data:
    name: comesh_sqlite_data
    external: true
