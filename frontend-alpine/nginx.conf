server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------------
    # Echte Client-Adresse hinter Cloudflare (Sicherheitsfix 2026-11-02)
    #
    # Aufbau: Client -> Cloudflare -> cloudflared (Netzwerk "host") ->
    #         veroeffentlichter Port 8767 -> Docker-Gateway -> dieser nginx.
    # Damit ist $remote_addr ohne real_ip-Modul IMMER 172.31.0.1 (gemessen),
    # also fuer jeden Benutzer dieselbe Adresse. Die Anwendung keyt ihre
    # Login-Sperre auf diese Adresse — fuenf Fehlversuche eines Angreifers
    # sperrten dadurch alle aus.
    #
    # CF-Connecting-IP ist ein normaler HTTP-Header und damit faelschbar. Er
    # wird deshalb NUR ausgewertet, wenn die TCP-Verbindung von einem der
    # unten genannten Netze kommt. Fuer alles andere (LAN 192.168.2.0/24,
    # Tailnet 100.64.0.0/10, direkt auf 8767) bleibt die Verbindungsadresse
    # massgeblich, ein gefaelschter Header wird ignoriert.
    #
    # 172.31.0.0/16 = Docker-Netz "comesh_default" (Bridge-Gateway
    # 172.31.0.1, ueber das der veroeffentlichte Port hereinkommt; geprueft
    # mit `docker network inspect comesh_default`).
    # Kommt cloudflared kuenftig aus einem anderen Docker-Netz, muss dessen
    # Subnetz hier ergaenzt werden — nicht pauschal 172.16.0.0/12 eintragen.
    # ---------------------------------------------------------------------
    set_real_ip_from 172.31.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Nach real_ip ist $remote_addr die echte Client-Adresse. X-Forwarded-For
    # wird darum ueberschrieben statt fortgeschrieben ($remote_addr statt
    # $proxy_add_x_forwarded_for): sonst schleppt die Anwendung einen vom
    # Client selbst mitgeschickten, gefaelschten Vorfahren-Eintrag mit.

    # OpenAI-kompatible API unter demselben Namen wie die Oberfläche (LANA-…).
    # Ohne diesen Block liefert /v1/models die HTML-Ersatzseite, weil nur /api/...
    # an die API weitergereicht wird — ein externer Client bekommt dann kein JSON.
    # Streaming braucht proxy_buffering off, sonst kommen die Teilstücke erst am
    # Ende an.
    location /v1/ {
        proxy_pass http://api:8000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Alte Adresse der Anleitung: Lesezeichen und geteilte Links bleiben gültig.
    location = /hilfe.html {
        return 301 /guide.html;
    }
    location = /anleitung.html {
        return 301 /guide.html;
    }

    # Pretty URLs / SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket chat (LANA-112): /api/ws/chat -> /ws/chat on the API container.
    # Must be a separate location with Upgrade/Connection headers, otherwise the
    # browser WS handshake dies behind nginx and the client silently falls back
    # to HTTP.
    location = /api/ws/chat {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # CF idle-timeout-safe: the app-level keepalive (ws.py) keeps frames
        # flowing; the read timeout must comfortably exceed that interval.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Proxy API calls to the backend service
    # Only proxy the actual API paths so the root ("/") still serves our SPA.
    location ~ ^/api/(auth|v1|health|admin|payments|nodes|pool)/? {
        # Strip /api prefix, so /api/v1/me -> /v1/me
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts for chat completions. Ein großes Modell (27B) braucht beim ersten
        # Aufruf Minuten, bis es geladen ist — 180 s reichten nicht und der Client sah 502.
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Revalidate static assets on every load. HTML is already no-store, but if
    # JS/CSS are served from a 1h cache a deploy produces new markup with the
    # OLD stylesheet/script — the page silently keeps the previous design.
    # `no-cache` still allows a 304 via ETag, so this costs one conditional
    # request, not a re-download.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        etag on;
    }

    # Don't cache HTML
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
