server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Pretty URLs / SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service
    # Only proxy the actual API paths so the root ("/") still serves our SPA.
    location ~ ^/api/(auth|v1|health|admin|payments|nodes|pool)/? {
        # Strip /api prefix, so /api/v1/me -> /v1/me
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts for chat completions
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # Revalidate static assets on every load. HTML is already no-store, but if
    # JS/CSS are served from a 1h cache a deploy produces new markup with the
    # OLD stylesheet/script — the page silently keeps the previous design.
    # `no-cache` still allows a 304 via ETag, so this costs one conditional
    # request, not a re-download.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        etag on;
    }

    # Don't cache HTML
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
