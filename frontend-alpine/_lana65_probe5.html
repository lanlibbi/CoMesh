<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>LANA-65 probe v5</title></head>
<body>
<div id="out">loading</div>
<script>
/* LANA-65 probe v5 — diagnostic re-test of the views that failed to mount the
   chrome in v4 (pool.html, usage.html).  Instead of snapshotting on a fixed
   timer it waits for window.I18n to appear inside the iframe, and records the
   in-iframe JS errors + loaded scripts so a real bug can be told apart from a
   measurement artifact.  One case per page load, result POSTed to :8898. */
const COLLECTOR = "http://127.0.0.1:8898";
const qs = new URLSearchParams(location.search);
const lang = qs.get("lang"), view = qs.get("view");
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function snapshot(iframe, extra) {
  const d = iframe.contentDocument, w = iframe.contentWindow;
  const nav = [...d.querySelectorAll(".nav .nav-link")].map((a) => a.textContent.trim());
  const menu = d.querySelector(".lang-menu");
  const items = menu ? [...menu.querySelectorAll(".lang-item")].map((b) => ({
    code: b.getAttribute("data-lang-set"), checked: b.getAttribute("aria-checked") === "true",
  })) : null;
  const summary = d.querySelector("details.lang summary");
  const text = (d.body.innerText || "").replace(/\s+/g, " ");
  return {
    htmlLang: d.documentElement.getAttribute("lang"),
    htmlTheme: d.documentElement.getAttribute("data-theme"),
    title: d.title,
    switcherSummary: summary ? summary.textContent.trim() : null,
    codes: items ? items.map((i) => i.code) : null,
    switcherCount: items ? items.length : 0,
    themeToggle: !!d.querySelector("[data-theme-set]"),
    i18nLoaded: !!w.I18n,
    localesReported: w.I18n ? w.I18n.locales : null,
    activeLang: w.I18n ? w.I18n.lang : null,
    nav,
    rawKey: /(?:^|\s)(nav|chrome|common|unit|fmt|err|app|dash|usage)\.[a-z_.]+/.test(text),
    cjk: /[\u2e80-\u9fff\u3000-\u303f\uff00-\uffef]/.test(text),
    ptText: /\b(Sair|Idioma|Portugu|Não|Você|Entrar)\b/.test(text),
    readyState: d.readyState,
    scriptsLoaded: [...d.querySelectorAll("script[src]")].map((s) => s.getAttribute("src")),
    ...extra,
  };
}

(async () => {
  localStorage.setItem("gp_lang", lang);
  localStorage.setItem("gp_theme", "dark");
  const errors = [];
  let rec = { lang, view, requested: lang };
  try {
    const iframe = document.createElement("iframe");
    iframe.style.cssText = "width:1200px;height:900px;border:0";
    iframe.src = view + "?_probe=" + Math.random();
    document.body.appendChild(iframe);
    // wait for the iframe document to exist, then hook its error handler
    let w = null;
    for (let i = 0; i < 60 && !w; i++) {
      try { if (iframe.contentWindow && iframe.contentDocument && iframe.contentDocument.body) w = iframe.contentWindow; } catch {}
      if (!w) await sleep(100);
    }
    if (w) {
      try {
        w.addEventListener("error", (e) => errors.push(String(e.message || e.error || "?")), true);
        w.onerror = (m, s) => { errors.push("onerror: " + m); };
      } catch {}
    }
    // poll for I18n + the mounted switcher instead of a fixed sleep
    let waited = 0;
    while (waited < 15000) {
      await sleep(500); waited += 500;
      let ok = false;
      try { ok = !!(w && w.I18n) && !!iframe.contentDocument.querySelector("[data-theme-set]"); } catch { ok = false; }
      if (ok) break;
    }
    rec = { ...rec, ...snapshot(iframe, { waitedMs: waited, errors, settled: true }) };
  } catch (e) {
    rec = { ...rec, error: "driver: " + e.message };
  }
  document.getElementById("out").textContent = "REC " + JSON.stringify(rec);
  try {
    await fetch(COLLECTOR + "/result", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify(rec), keepalive: true,
    });
  } catch (e) {}
  localStorage.removeItem("gp_lang");
  localStorage.removeItem("gp_theme");
  document.title = "DONE:" + lang + ":" + view;
})();
</script>
</body>
</html>
