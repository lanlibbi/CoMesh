<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title data-i18n="title.chat">Chat · CoMesh</title>
<meta name="color-scheme" content="dark light" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script>
/* Apply the stored theme BEFORE the stylesheet loads, so the first paint is
   already the right palette. Dark is the default; a first-time visitor follows
   the OS setting until they choose explicitly. Kept inline and tiny on purpose —
   it must not depend on the rest of the JS. */
(function () {
  try {
    var stored = localStorage.getItem("gp_theme");
    var theme = (stored === "light" || stored === "dark") ? stored
      : (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    document.documentElement.setAttribute("data-theme", theme);
  } catch (e) {
    document.documentElement.setAttribute("data-theme", "dark");
  }
})();
</script>
<link rel="stylesheet" href="style.css" />
</head>
<body x-data="chatPage()" x-init="init()">
  <div x-html="navHTML('chat')"></div>

  <main class="shell" style="max-width:960px">
    <div class="page-head">
      <div class="eyebrow" data-i18n="inference">Inference</div>
      <h1>Chat</h1>
      <p class="lede">
        Direkter Testlauf gegen den Pool. Abgerechnet wird pro Token über dein Guthaben —
        aktuell <span class="text-brand num" x-text="fmtCredits(me?.credits)"></span> Credits.
      </p>
    </div>

    <div class="card">
      <div class="panel-head">
        <div>
          <div class="eyebrow" data-i18n="session">Session</div>
          <h3 x-text="model || I18n.t('chat.choose_model')"></h3>
        </div>
        <div class="row">
          <label class="label" for="model" style="margin:0">Modell</label>
          <select class="input" id="model" x-model="model"
                  style="width:auto;min-width:230px" :disabled="models.length === 0">
            <option value="" disabled x-text="models.length ? I18n.t('chat.choose_model') : I18n.t('common.loading')"></option>
            <template x-for="m in models" :key="m.name">
              <option :value="m.name"
                      x-text="m.name + (m.size ? ' — ' + (m.size / 1e9).toFixed(1) + ' GB' : '')"></option>
            </template>
          </select>
          <button class="btn-ghost btn-sm" @click="loadModels()" title="Modellliste neu laden" data-i18n-title="modellliste-neu-laden" data-i18n="aktualisieren">Aktualisieren</button>
        </div>
      </div>

      <div class="divider"></div>

      <div class="thread" x-show="messages.length === 0 && !loading">
        <div class="empty">
          <span class="empty-mark" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/>
            </svg>
          </span>
          <p data-i18n="noch-keine-nachricht-starte-mit-einer-der">Noch keine Nachricht. Starte mit einer der Vorlagen oder tippe direkt los.</p>
        </div>
        <div class="row wrap" style="justify-content:center">
          <template x-for="p in prompts" :key="p.label">
            <button class="btn-ghost btn-sm" @click="usePrompt(p.text)" x-text="p.label"></button>
          </template>
        </div>
      </div>

      <div class="thread" x-show="messages.length > 0 || loading">
        <template x-for="(m, idx) in messages" :key="idx">
          <div class="row" :style="m.role === 'user' ? 'justify-content:flex-end' : 'justify-content:flex-start'">
            <div class="chat-bubble" :class="m.role === 'user' ? 'chat-user' : 'chat-assistant'"
                 x-text="m.content"></div>
          </div>
        </template>
        <div class="row" x-show="loading" style="justify-content:flex-start">
          <div class="chat-bubble chat-assistant">
            <span class="typing" aria-label="Antwort wird erzeugt" data-i18n-aria-label="antwort-wird-erzeugt"><i></i><i></i><i></i></span>
          </div>
        </div>
      </div>
    </div>

    <form @submit.prevent="send()" class="composer mt-3">
      <textarea class="input grow" rows="2" x-model="input"
                @keydown.enter.exact.prevent="send()"
                placeholder="Nachricht schreiben — Enter sendet, Shift+Enter macht eine neue Zeile"
                :disabled="loading"></textarea>
      <button type="submit" class="btn-primary" :disabled="loading || !input.trim() || !model">
        <span x-show="!loading" data-i18n="senden">Senden</span>
        <span x-show="loading">…</span>
      </button>
    </form>

    <div class="row between mt-2">
      <span class="t-xs text-mute mono" x-show="lastUsage">
        Letzte Antwort: <span x-text="fmtNumber(lastUsage?.total_tokens)"></span> Token ·
        <span x-text="fmtCredits(lastUsage?.credits_used)"></span> Credits
      </span>
      <span class="t-xs text-mute mono" x-show="messages.length">
        <span x-text="messages.length"></span> Nachrichten im Verlauf
      </span>
    </div>
  </main>

      <script defer src="https://unpkg.com/alpinejs@3.5.1/dist/cdn.min.js"></script>
<script src="i18n-catalog.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
  <script>
    function chatPage() {
      return {
        me: Auth.currentUser(),
        models: [],
        model: "",
        messages: [],
        input: "",
        loading: false,
        lastUsage: null,
        prompts: [
          { label: "Quantencomputing erklären", text: "Erkläre Quantencomputing in drei Sätzen." },
          { label: "Python Hello-World", text: "Schreibe ein Python Hello-World mit Type Hints." },
          { label: "Ideen für ein Nebenprojekt", text: "Gib mir drei Ideen für ein Nebenprojekt." },
        ],

        async init() {
          if (!Auth.requireLogin()) return;
          await this.loadModels();
          try { this.me = await refreshUser(); } catch (e) { /* keep cached user */ }
        },

        usePrompt(text) {
          this.input = text;
        },

        async loadModels() {
          try {
            const r = await API("/v1/models", { auth: true });
            this.models = r.models || [];
            if (this.models.length > 0 && !this.model) this.model = this.models[0].name;
          } catch (e) {
            toast("Modelle konnten nicht geladen werden: " + e.message, "err");
          }
        },

        async send() {
          const text = this.input.trim();
          if (!text || !this.model || this.loading) return;
          this.input = "";
          this.messages.push({ role: "user", content: text });
          this.loading = true;
          this.lastUsage = null;

          if (this.me && this.me.credits != null && this.me.credits < 0.01) {
            this.loading = false;
            toast("Guthaben reicht nicht — bitte Credits aufladen.", "err", 5000);
            return;
          }

          try {
            // Send the full history so the model keeps context. Long sessions
            // would need trimming; fine for the POC.
            const r = await API("/v1/chat/completions", {
              method: "POST",
              auth: true,
              body: {
                model: this.model,
                messages: this.messages.map(m => ({ role: m.role, content: m.content })),
                temperature: 0.7,
                max_tokens: 512,
              },
            });
            const reply = r.choices?.[0]?.message?.content || "(keine Antwort)";
            this.messages.push({ role: "assistant", content: reply });
            const total = r.usage?.total_tokens || 0;
            this.lastUsage = { total_tokens: total, credits_used: total / 1000 * 0.001 };
            this.me = await refreshUser();
          } catch (e) {
            toast("Chat-Fehler: " + e.message, "err", 5000);
          } finally {
            this.loading = false;
          }
        },
      };
    }
  </script>
</body>
</html>
