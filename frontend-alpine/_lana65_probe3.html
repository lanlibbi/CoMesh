<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>LANA-65 probe v3</title></head>
<body>
<div id="out">running</div>
<script>
/* LANA-65 verification probe, v3 (temporary; not part of the product).
   Same checks as v1/v2; results are POSTed per record to the collector on
   :8898 so a CDP/tab restart cannot lose them. */
const COLLECTOR = "http://127.0.0.1:8898";
const LANGS = ["en", "de", "es", "fr", "pt", "zh", "XX"];
const VIEWS = ["index.html", "chat.html", "usage.html", "nodes.html", "pool.html",
               "profile.html", "earnings.html", "agent.html", "login.html",
               "register.html", "credits.html", "admin-usage.html"];
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let done = 0;

function send(rec) {
  done++;
  document.getElementById("out").textContent = "PROGRESS " + done + "/" + (LANGS.length * VIEWS.length);
  fetch(COLLECTOR + "/result", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify(rec), keepalive: true,
  }).catch(() => {});
}

function loadView(view, timeoutMs = 12000) {
  return new Promise((resolve) => {
    const iframe = document.createElement("iframe");
    iframe.style.cssText = "width:1200px;height:900px;border:0";
    iframe.src = view + "?_probe=" + Math.random();
    let settled = false;
    const finish = (err) => { if (settled) return; settled = true; resolve({ iframe, err }); };
    iframe.addEventListener("load", () => { sleep(1500).then(() => finish(null)); });
    setTimeout(() => finish("timeout"), timeoutMs);
    document.body.appendChild(iframe);
  });
}

function snapshot(iframe) {
  const d = iframe.contentDocument, w = iframe.contentWindow;
  const nav = [...d.querySelectorAll(".nav .nav-link")].map((a) => a.textContent.trim());
  const menu = d.querySelector(".lang-menu");
  const items = menu ? [...menu.querySelectorAll(".lang-item")].map((b) => ({
    code: b.getAttribute("data-lang-set"), checked: b.getAttribute("aria-checked") === "true",
  })) : null;
  const summary = d.querySelector("details.lang summary");
  const text = (d.body.innerText || "").replace(/\s+/g, " ");
  return {
    htmlLang: d.documentElement.getAttribute("lang"),
    htmlTheme: d.documentElement.getAttribute("data-theme"),
    title: d.title,
    switcherSummary: summary ? summary.textContent.trim() : null,
    codes: items ? items.map((i) => i.code) : null,
    switcherCount: items ? items.length : 0,
    themeToggle: !!d.querySelector("[data-theme-set]"),
    i18nLoaded: !!w.I18n,
    localesReported: w.I18n ? w.I18n.locales : null,
    activeLang: w.I18n ? w.I18n.lang : null,
    nav,
    rawKey: /(?:^|\s)(nav|chrome|common|unit|fmt|err|app|dash|usage)\.[a-z_.]+/.test(text),
    cjk: /[\u2e80-\u9fff\u3000-\u303f\uff00-\uffef]/.test(text),
    ptText: /\b(Sair|Idioma|Portugu|Não|Você|Entrar)\b/.test(text),
  };
}

window.__probeDone = false;
(async () => {
  for (const lang of LANGS) {
    for (const view of VIEWS) {
      localStorage.setItem("gp_lang", lang);
      localStorage.setItem("gp_theme", "dark");
      const { iframe, err } = await loadView(view);
      let snap = null;
      try { snap = err ? { error: err } : snapshot(iframe); } catch (e) { snap = { error: "read: " + e.message }; }
      send({ lang, view, requested: lang, ...snap });
      iframe.remove();
    }
  }
  localStorage.removeItem("gp_lang");
  localStorage.removeItem("gp_theme");
  document.title = "done";
  window.__probeDone = true;
  fetch(COLLECTOR + "/done", { method: "POST", body: "ok" }).catch(() => {});
})();
</script>
<script src="brand-mesh.js"></script>
</body>
</html>
