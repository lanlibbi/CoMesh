# Sicherheitsköpfe für alle Antworten.
# 'unsafe-eval' ist PFLICHT: Alpine.js wertet x-data/x-html-Ausdrücke über
# new AsyncFunction() aus. Ohne dieses Schlüsselwort lädt Alpine zwar, initialisiert
# aber keine Komponente — die Seiten zeigen dann nur ihr statisches HTML, ohne
# Navigation und ohne Funktion (am 12.11.2026 genau so passiert).
# 'unsafe-inline' ist für die inline-<script>-Blöcke der Seiten nötig (Theme-Weiche vor
# dem ersten Aufbau, Alpine-Komponenten); unpkg.com liefert Alpine.js, Google die Schriften.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
