name: tests

# Die Suite startet ihren eigenen uvicorn (kein Container, keine GPU) — sie kann also
# in CI laufen. `test_auth_hardening.py` ist ein eigenständiges Skript und wird
# zusätzlich direkt aufgerufen, weil es der belastbare Auth-Gate ist.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: pytest
        run: python -m pytest -q -p no:warnings

      - name: Auth-Härtung (eigenständiges Skript)
        run: python tests/test_auth_hardening.py
